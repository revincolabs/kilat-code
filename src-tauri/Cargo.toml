[package]
name = "kilat"
version = "0.2.0"
description = "Kilat Code - editor ringan untuk multi-agent (Claude, Codex) dengan multi akun"
edition = "2021"

[lib]
name = "kilat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
anyhow = "1"
base64 = "0.22"
regex = "1"
parking_lot = "0.12"

# Secrets go to the OS keychain: Credential Manager, macOS Keychain, or the
# Secret Service (GNOME Keyring / KWallet) on Linux.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
